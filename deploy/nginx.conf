# vladcealicu.com — HTTPS (managed by golive.sh)

limit_req_zone $binary_remote_addr zone=vladcealicu_limit:10m rate=10r/s;

# Agents that send "Accept: text/markdown" get the Markdown twin of /
map $http_accept $vladcealicu_wants_md {
    default            0;
    "~*text/markdown"  1;
}

# HTTP → HTTPS redirect (both naked and www)
server {
    listen 80;
    listen [::]:80;
    server_name vladcealicu.com www.vladcealicu.com;
    return 301 https://www.vladcealicu.com$request_uri;
}

# HTTPS naked → www redirect
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vladcealicu.com;

    ssl_certificate /etc/letsencrypt/live/vladcealicu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vladcealicu.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.vladcealicu.com$request_uri;
}

# Main server block
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.vladcealicu.com;

    ssl_certificate /etc/letsencrypt/live/vladcealicu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vladcealicu.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;

    root /var/www/vladcealicu.com/public;
    index index.html;

    access_log off;
    error_log /var/log/nginx/vladcealicu.com.error.log crit;

    limit_req zone=vladcealicu_limit burst=20 nodelay;
    limit_req_status 429;
    server_tokens off;

    # UTF-8 everywhere, so "Galápagos" survives in .md and .txt too
    charset utf-8;
    charset_types text/plain text/markdown text/css text/xml application/javascript application/json application/ld+json application/manifest+json application/xml;

    include /etc/nginx/mime.types;
    types {
        text/markdown              md;
        application/manifest+json  webmanifest;
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/css text/javascript text/plain text/xml text/markdown
               application/javascript application/json application/ld+json
               application/manifest+json application/xml image/svg+xml font/woff font/woff2;

    # NOTE: nginx drops server-level add_header lines in any location that
    # sets its own, so every location below repeats the security headers.

    # / → HTML for browsers, Markdown for agents that ask for it
    location = / {
        if ($vladcealicu_wants_md) { rewrite ^ /index.md last; }
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        add_header Cache-Control "no-cache" always;
        add_header Vary "Accept" always;
        add_header Link "</index.md>; rel=\"alternate\"; type=\"text/markdown\", </llms.txt>; rel=\"describedby\"; type=\"text/plain\"" always;
        try_files /index.html =404;
    }

    # One canonical home URL
    location = /index.html {
        if ($request_uri ~* "^/index\.html") { return 301 /; }
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
    }

    # HTML — always revalidate (no-cache keeps the back/forward cache working, no-store breaks it)
    location ~* \.html$ {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        add_header Cache-Control "no-cache" always;
    }

    # Agent and crawler files — short cache, open to anyone
    location ~* \.(md|txt|xml|webmanifest)$ {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Vary "Accept" always;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Robots-Tag "noindex" always;
    }

    # Static assets — cache for a year (rename the file when it changes)
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff|woff2)$ {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # security.txt and friends live here; the dotfile block below would eat them otherwise
    location ^~ /.well-known/ {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Clean URLs
    location / {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri.html $uri/ =404;
    }

    # Block hidden files
    location ~ /\. { deny all; }

    # Block WordPress probes
    location ~* (wp-admin|wp-login|\.php$) { deny all; }

    error_page 404 /error/404.html;
}
